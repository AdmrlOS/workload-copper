name: Source tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Python service and confinement tests
        run: python3 -m unittest discover -s tests -v
      - name: Browser telemetry tests
        run: node --test www/*.test.js
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build actual ARM64 runtime and execute Rust and packaged service tests
        run: docker buildx build --platform linux/arm64 --load --build-arg IMAGE_REVISION="$GITHUB_SHA" -t copper-rover:ci .
      - name: Verify native replay, tamper rejection and persistence
        run: python3 tests/check_image.py copper-rover:ci
