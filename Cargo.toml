[package]
name = "copper-rover"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
build = "build.rs"

[dependencies]
cu29 = { version = "=1.3.1", default-features = false, features = ["std", "log-level-error"] }
cu29-export = "=1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = { package = "cu-bincode", version = "=2.2.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[build-dependencies]
cu29-build = "=1.3.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
